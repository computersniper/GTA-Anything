[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-anything"
version = "0.1.0"
description = "Agent-Native Gameplay Extraction, Clean-Room Transpilation, Asset Auditing & Reversible Deployment Framework for GTA Open-World Hosts (Gen9 Enhanced & Gen8 Legacy)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "GTA-Anything Contributors" }
]
keywords = [
    "gta",
    "gtav",
    "world-model",
    "agent-harness",
    "gameplay-ir",
    "transpiler",
    "clean-room",
    "shvdn",
    "rph"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
gta-anything = "gta_anything.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
